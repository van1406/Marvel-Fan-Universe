<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARVEL — Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f0f0f0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      .dash {
        text-align: center;
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .dash h1 {
        font-family: "Bebas Neue", "Arial Black", sans-serif;
        font-size: 3rem;
        letter-spacing: 0.1em;
        color: #e23636;
        margin-bottom: 12px;
      }
      .dash p {
        font-size: 1.1rem;
        color: #888;
        margin-bottom: 32px;
      }
      .dash a {
        display: inline-block;
        padding: 12px 32px;
        background: linear-gradient(135deg, #e23636, #b01010);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: box-shadow 0.3s;
      }
      .dash a:hover {
        box-shadow: 0 6px 30px rgba(226, 54, 54, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="dash">
      <h1>Welcome to MARVEL</h1>
      <p>You have successfully entered the universe.</p>
      <a href="/">← Back to Login</a>
    </div>
  </body>
</html>
